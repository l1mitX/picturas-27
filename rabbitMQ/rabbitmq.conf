auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN
loopback_users = none
auth_backends.1 = rabbit_auth_backend_internal
auth_backends.2 = rabbit_auth_backend_anon
listeners.tcp.default = 5672
#default_pass = admin
#default_user = admin
hipe_compile = false
#management.listener.port = 15672
#management.listener.ssl = false
management.tcp.port = 15672
management.load_definitions = /etc/rabbitmq/definitions.json

# RNF1 T022 (R6, H-04): an unacknowledged video stage is redelivered after this time.
# Worst stage measured on 2026-11-26 (599 s Premium video, 2 in parallel): 895 s
# (edit) and 875 s (subtitles); 30 min keeps a 2x margin. Same as the default,
# set explicitly so a RabbitMQ upgrade cannot lower it.
consumer_timeout = 1800000
